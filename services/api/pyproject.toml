[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diet-assistant-api"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-ai>=0.0.13",
    "anthropic>=0.40.0",
    "openai>=1.30.0",
    "openpyxl>=3.1.2",
    "defusedxml>=0.7.1",
    "filelock>=3.13.0",
    "rapidfuzz>=3.6.1",
    "aiosqlite>=0.20.0",
    "python-multipart>=0.0.9",
    "python-dateutil>=2.9.0",
    "pytz>=2024.1",
    "httpx>=0.27.0",
    "pydantic-settings>=2.3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
